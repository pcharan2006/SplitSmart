server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's built-in DNS. Resolving the backend lazily (via a variable) means nginx still starts
  # even if the backend isn't up yet, instead of crashing with "host not found in upstream".
  resolver 127.0.0.11 valid=10s;
  set $backend http://backend:5000;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Small uploads only (avatars are capped at 2 MB by the API as well).
  client_max_body_size 3m;

  # Used by the container health check.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # The browser talks only to this server; /api and /uploads are forwarded to the backend.
  # No security headers are added here: the backend sets its own (Helmet), and doubling them up
  # would send two conflicting Content-Security-Policy headers.
  location /api/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # The backend (TRUST_PROXY=1) reads the visitor's real IP from here for rate limiting.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;  # AI answers can take a few seconds
  }

  location /uploads/ {
    proxy_pass $backend;
    proxy_set_header Host $host;
  }

  # Vite gives built files content-hashed names, so they can be cached "forever".
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Single-page app: any other URL (e.g. /groups/5) must serve index.html and let React Router decide.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
